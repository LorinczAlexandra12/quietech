<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#f5f7fa"/>
  
  <!-- Decorative circles -->
  <circle cx="1000" cy="100" r="150" fill="#e94560" opacity="0.1"/>
  <circle cx="200" cy="500" r="200" fill="#0f3460" opacity="0.05"/>
  
  <!-- Main text -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    QuieTech - Healthtech Innovation
  </text>
  
  <!-- Subtext -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#666666">
    Coming Soon
  </text>
  
  <!-- Simple heart ring graphic -->
  <g transform="translate(600, 450)">
    <!-- Ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#e94560" stroke-width="12"/>
    <!-- Heart inside -->
    <text x="0" y="12" font-size="40" text-anchor="middle" fill="#e94560">♡</text>
  </g>
</svg>
