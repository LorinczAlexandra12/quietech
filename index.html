<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuieTech | Coming Soon</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">QuieTech</div>
            <div class="navbar-right">
                <div class="language-switcher">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <span class="separator">/</span>
                    <button class="lang-btn" data-lang="hu">HU</button>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark/light theme">
                    <svg class="theme-icon-svg moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg class="theme-icon-svg sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title" data-en="Uncompromising Health Monitoring" data-hu="Kompromisszummentes Egészségkövetés">
                    Uncompromising Health Monitoring
                </h1>
                <p class="hero-subtitle" data-en="Every Hour. Every Moment." data-hu="Minden Órában. Minden Pillanatban.">
                    Every Hour. Every Moment.
                </p>
                <div class="hero-description">
                    <p data-en="Revolutionary health tracking technology that seamlessly integrates into your daily life. Coming soon." data-hu="Forradalmi egészségkövetési technológia, amely zökkenőmentesen illeszkedik az Ön napi rutinjába. Hamarosan érkezik.">
                        Revolutionary health tracking technology that seamlessly integrates into your daily life. Coming soon.
                    </p>
                </div>

                <!-- CTA Section -->
                <div class="cta-section">
                    <h2 class="cta-title" data-en="Stay Connected" data-hu="Iratkozz fel a listára">
                        Stay Connected
                    </h2>
                    <p class="cta-subtitle" data-en="Be the first to know when we launch" data-hu="Légy az első, aki megtudja, amikor elindulunk">
                        Be the first to know when we launch
                    </p>
                    
                    <form class="newsletter-form" id="newsletterForm">
                        <input 
                            type="email" 
                            class="email-input" 
                            placeholder="your@email.com"
                            data-en-placeholder="your@email.com"
                            data-hu-placeholder="email@cim.com"
                            required
                        >
                        <button type="submit" class="submit-btn" data-en="Subscribe" data-hu="Iratkozz fel a listára">
                            Subscribe
                        </button>
                    </form>
                    <p class="form-message" id="formMessage"></p>
                </div>
            </div>

            <!-- Illustration Circle -->
            <div class="hero-visual">
                <div class="ring-illustration">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="100" r="85" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                        <circle cx="100" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
                        <circle cx="100" cy="100" r="55" fill="none" stroke="currentColor" stroke-width="3" opacity="0.8"/>
                        <circle cx="100" cy="100" r="45" fill="currentColor" opacity="0.1"/>
                        <text x="100" y="110" text-anchor="middle" font-size="16" fill="currentColor" opacity="0.6">♡</text>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="contact">
        <div class="container">
            <div class="contact-info-simple">
                <div class="contact-item">
                    <h3 data-en="Contact" data-hu="Kapcsolat">Contact</h3>
                    <a href="mailto:contact@quietech.com" class="contact-link">contact@quietech.com</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-status" data-en="Coming Soon" data-hu="Hamarosan érkezik">
                Coming Soon
            </p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
